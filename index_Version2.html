<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EiyuruVoice AI - Parking Violations</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Parking Violations by State</h1>

      <div class="controls">
        <button id="generateBtn">Generate Report</button>
      </div>

      <div class="summary">
        <h2>Most common violation per state</h2>
        <table id="resultsTable">
          <thead>
            <tr>
              <th>Registration State</th>
              <th>Most Common Violation</th>
              <th>Count</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
